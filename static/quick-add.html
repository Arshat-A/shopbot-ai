<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quick Add — Royal Enterprises</title>
<link rel="manifest" href="/manifest-owner.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --cream:#FDF6ED;
    --walnut:#3D2B1F;
    --walnut-soft:#6B4F3F;
    --gold:#C89B3C;
    --gold-soft:#E8D5A8;
    --line:#E6DCC8;
  }
  *{font-family:'Inter',sans-serif;}
  .font-display{font-family:'Playfair Display',serif;}
  body{background:var(--cream); color:var(--walnut);}
  .card{background:#fff; border:1px solid var(--line); border-radius:18px;}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-gold:active{background:#B08A32;}
  .btn-outline{border:1.5px solid var(--walnut); color:var(--walnut); background:transparent;}
  input, select, textarea{
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:12px 14px; width:100%; font-size:15px; color:var(--walnut);
  }
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--gold);
  }
  label.field-label{
    font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--walnut-soft); margin-bottom:6px; display:block;
  }
  .thumb{
    width:72px; height:72px; border-radius:10px; object-fit:cover;
    border:1.5px solid var(--line);
  }
  .spinner{
    width:18px; height:18px; border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .pulse-ring{
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(200,155,60,.5);}
    100%{box-shadow:0 0 0 16px rgba(200,155,60,0);}
  }
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:var(--walnut); color:var(--cream); padding:12px 20px;
    border-radius:12px; font-size:14px; font-weight:500; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s;
  }
  .toast.show{opacity:1; bottom:40px;}
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body class="min-h-screen pb-28">

  <!-- Header -->
  <div class="sticky top-0 z-40 bg-[var(--cream)]/95 backdrop-blur border-b border-[var(--line)] px-5 pt-5 pb-4 flex items-center justify-between">
    <div>
      <p class="text-[11px] tracking-widest uppercase text-[var(--walnut-soft)] font-semibold">Royal Enterprises</p>
      <h1 class="font-display text-2xl font-bold leading-tight">Quick Add</h1>
    </div>
    <a href="/owner" class="text-sm font-medium text-[var(--walnut-soft)] underline underline-offset-2">Dashboard</a>
  </div>

  <div class="px-5 mt-5 space-y-5">

    <!-- Capture card -->
    <div class="card p-5 text-center">
      <div id="captureIdle">
        <div class="w-16 h-16 mx-auto rounded-full bg-[var(--gold-soft)] flex items-center justify-center mb-3 pulse-ring">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--walnut)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <p class="font-display text-lg font-semibold mb-1">Snap the product</p>
        <p class="text-sm text-[var(--walnut-soft)] mb-4">First photo auto-fills the details below</p>
        <button onclick="document.getElementById('mainCapture').click()" class="btn-gold w-full py-3.5 rounded-full font-semibold text-[15px] flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          Open Camera
        </button>
        <input type="file" id="mainCapture" accept="image/*" capture="environment" class="hidden" onchange="handleFirstPhoto(event)">
      </div>

      <div id="captureAnalyzing" class="hidden py-4">
        <div class="w-10 h-10 mx-auto rounded-full bg-[var(--walnut)] flex items-center justify-center mb-3">
          <div class="spinner"></div>
        </div>
        <p class="font-medium text-sm">Reading the photo…</p>
        <p class="text-xs text-[var(--walnut-soft)] mt-1">Filling in name, category, size &amp; color</p>
      </div>
    </div>

    <!-- Photos strip (shown once at least one photo exists) -->
    <div id="photosSection" class="hidden fade-in">
      <label class="field-label">Photos</label>
      <div id="photoStrip" class="flex gap-2.5 flex-wrap items-center"></div>
    </div>

    <!-- Form -->
    <div id="formSection" class="hidden card p-5 space-y-4 fade-in">
      <div>
        <label class="field-label">Product Name</label>
        <input type="text" id="fieldName" placeholder="e.g. 3-Door Wardrobe">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Price (₹)</label>
          <input type="number" id="fieldPrice" placeholder="e.g. 8500" inputmode="numeric">
        </div>
        <div>
          <label class="field-label">Category</label>
          <select id="fieldCategory">
            <option value="">Select</option>
            <option>Wardrobe</option>
            <option>Bed</option>
            <option>Sofa</option>
            <option>Dining</option>
            <option>Dressing Table</option>
            <option>Shoe Rack</option>
            <option>Cupboard</option>
            <option>Chair</option>
            <option>Table</option>
            <option>Storage</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Size</label>
          <input type="text" id="fieldSize" placeholder="e.g. 6x4 feet">
        </div>
        <div>
          <label class="field-label">Color</label>
          <input type="text" id="fieldColor" placeholder="e.g. Jungle Wood">
        </div>
      </div>

      <div>
        <label class="field-label">Description</label>
        <textarea id="fieldDescription" rows="3" placeholder="Sales-friendly description customers will see"></textarea>
      </div>

      <p id="aiNote" class="hidden text-xs text-[var(--gold)] font-medium flex items-center gap-1.5">
        ✨ AI-filled — check and edit before saving
      </p>
    </div>

  </div>

  <!-- Bottom action bar -->
  <div id="actionBar" class="hidden fixed bottom-0 left-0 right-0 bg-[var(--cream)]/95 backdrop-blur border-t border-[var(--line)] p-4 flex gap-3 z-50">
    <button onclick="resetForm()" class="btn-outline px-5 py-3.5 rounded-full font-semibold text-sm">Cancel</button>
    <button id="saveBtn" onclick="saveProduct()" class="btn-gold flex-1 py-3.5 rounded-full font-semibold text-[15px] flex items-center justify-center gap-2">
      Save Product
    </button>
  </div>

  <input type="file" id="extraCapture" accept="image/*" capture="environment" class="hidden" onchange="handleExtraPhoto(event)">

  <div id="toast" class="toast"></div>

<script>
let photos = []; // {file, url}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function renderPhotoStrip(){
  const strip = document.getElementById('photoStrip');
  strip.innerHTML = '';
  photos.forEach((p, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'relative';
    wrap.innerHTML = `
      <img src="${p.url}" class="thumb">
      <button onclick="removePhoto(${i})" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-[var(--walnut)] text-white text-xs flex items-center justify-center">✕</button>
      ${i === 0 ? '<span class="absolute bottom-0 left-0 right-0 text-[9px] bg-[var(--gold)] text-white text-center rounded-b-[8px] font-semibold py-0.5">MAIN</span>' : ''}
    `;
    strip.appendChild(wrap);
  });
  // add-more button
  const addBtn = document.createElement('button');
  addBtn.className = 'thumb flex items-center justify-center border-dashed text-[var(--walnut-soft)] text-2xl font-light';
  addBtn.style.borderStyle = 'dashed';
  addBtn.textContent = '+';
  addBtn.onclick = () => document.getElementById('extraCapture').click();
  strip.appendChild(addBtn);
}

function removePhoto(i){
  URL.revokeObjectURL(photos[i].url);
  photos.splice(i, 1);
  if (photos.length === 0){
    resetForm();
    return;
  }
  renderPhotoStrip();
}

async function handleFirstPhoto(event){
  const file = event.target.files[0];
  if (!file) return;

  photos.push({ file, url: URL.createObjectURL(file) });

  document.getElementById('captureIdle').classList.add('hidden');
  document.getElementById('captureAnalyzing').classList.remove('hidden');

  try {
    const formData = new FormData();
    formData.append('image', file);
    const res = await fetch('/quick-add/analyze', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.status === 'success' && data.detected !== false) {
      document.getElementById('fieldName').value = data.suggested_name || '';
      document.getElementById('fieldCategory').value = data.suggested_category || '';
      document.getElementById('fieldSize').value = data.suggested_size || '';
      document.getElementById('fieldColor').value = data.suggested_color || '';
      document.getElementById('fieldDescription').value = data.suggested_description || '';
      document.getElementById('aiNote').classList.remove('hidden');
    } else {
      showToast('Could not read photo clearly — fill in manually');
    }
  } catch (err) {
    showToast('Auto-fill failed — fill in manually');
  }

  document.getElementById('captureAnalyzing').classList.add('hidden');
  document.getElementById('captureIdle').classList.remove('hidden');
  document.getElementById('photosSection').classList.remove('hidden');
  document.getElementById('formSection').classList.remove('hidden');
  document.getElementById('actionBar').classList.remove('hidden');
  renderPhotoStrip();

  event.target.value = '';
}

function handleExtraPhoto(event){
  const file = event.target.files[0];
  if (!file) return;
  photos.push({ file, url: URL.createObjectURL(file) });
  renderPhotoStrip();
  event.target.value = '';
}

function resetForm(){
  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  document.getElementById('fieldName').value = '';
  document.getElementById('fieldPrice').value = '';
  document.getElementById('fieldCategory').value = '';
  document.getElementById('fieldSize').value = '';
  document.getElementById('fieldColor').value = '';
  document.getElementById('fieldDescription').value = '';
  document.getElementById('aiNote').classList.add('hidden');
  document.getElementById('photosSection').classList.add('hidden');
  document.getElementById('formSection').classList.add('hidden');
  document.getElementById('actionBar').classList.add('hidden');
  document.getElementById('captureAnalyzing').classList.add('hidden');
  document.getElementById('captureIdle').classList.remove('hidden');
}

async function saveProduct(){
  const name = document.getElementById('fieldName').value.trim();
  const price = document.getElementById('fieldPrice').value;
  const category = document.getElementById('fieldCategory').value;
  const size = document.getElementById('fieldSize').value.trim();
  const color = document.getElementById('fieldColor').value.trim();
  const description = document.getElementById('fieldDescription').value.trim();

  if (!name || !price || !category) {
    showToast('Name, price and category are required');
    return;
  }
  if (photos.length === 0) {
    showToast('Add at least one photo');
    return;
  }

  const saveBtn = document.getElementById('saveBtn');
  const originalHTML = saveBtn.innerHTML;
  saveBtn.innerHTML = '<div class="spinner"></div>';
  saveBtn.disabled = true;

  try {
    const formData = new FormData();
    formData.append('name', name);
    formData.append('price', price);
    formData.append('category', category);
    formData.append('description', description);
    formData.append('size', size);
    formData.append('color', color);
    photos.forEach(p => formData.append('images', p.file));

    const res = await fetch('/catalogue', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.status === 'added') {
      showToast(`✓ ${name} added to catalogue`);
      resetForm();
    } else {
      showToast('Could not save — try again');
    }
  } catch (err) {
    showToast('Network error — try again');
  }

  saveBtn.innerHTML = originalHTML;
  saveBtn.disabled = false;
}
</script>
</body>
</html>
